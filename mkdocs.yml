# this_file: mkdocs.yml
site_name: "vexy-lines-cli"
site_url: https://vexy.dev/vexy-lines-cli/
site_description: "CLI tool and MCP passthrough server for Vexy Lines"
theme:
  name: fly-january-remote
  custom_dir: overrides
  features:
    - navigation.path
    - toc.follow
    - content.code.copy
    - navigation.sections
  palette:
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Light mode
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Dark mode
docs_dir: src_docs
site_dir: docs
extra:
  fly:
    chrome: vexy
    chrome_options:
      site-label: Vexy Lines CLI
markdown_extensions:
  - pymdownx.highlight:
      auto_title: true
      auto_title_map:
        Python: ""
        Bash: ""
        JSON: ""
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

plugins:
  - fly
  - search
  - meta
  - tags:
      filters:
        exclude: [print_page.md]
  - awesome-nav
hooks:
  - print_guide.py
