# this_file: mkdocs.yml
site_name: "vexy-lines-cli"
site_description: "CLI tool and MCP passthrough server for Vexy Lines"
theme:
  custom_dir: overrides
  name: materialx
  features:
    - navigation.path
    - toc.follow
    - content.code.copy
    - navigation.sections
  palette:
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Light mode
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Dark mode
docs_dir: src_docs
site_dir: docs
markdown_extensions:
  - pymdownx.highlight:
      auto_title: true
      auto_title_map:
        Python: ""
        Bash: ""
        JSON: ""
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

plugins:
  - materialx/search
  - materialx/meta
  - materialx/tags
  - awesome-nav
  - print-site:
      add_to_navigation: true
      print_page_title: Print this guide
